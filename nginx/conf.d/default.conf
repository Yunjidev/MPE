# ── Phase 1 : HTTP only (avant SSL) ────────────────────────────────────────
# Ce fichier est utilisé AVANT que le certificat Let's Encrypt soit obtenu.
# Après init-ssl.sh, il est remplacé par proxilio.conf

server {
    listen 80;
    server_name proxilio.fr www.proxilio.fr;

    # ACME challenge pour Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 'Proxilio - En cours de configuration SSL...';
        add_header Content-Type text/plain;
    }
}

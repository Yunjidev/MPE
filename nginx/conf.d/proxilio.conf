# ── Détection des bots pour prerendering ────────────────────────────────────
# Les crawlers reçoivent du HTML rendu par headless Chrome (prerender).
# HeadlessChrome EXCLU pour éviter la boucle prerender→nginx→prerender.
map $http_user_agent $is_bot {
    default                                                         0;
    ~*(googlebot|bingbot|yandex|baiduspider|duckduckbot)           1;
    ~*(twitterbot|facebookexternalhit|linkedinbot|whatsapp)        1;
    ~*(slackbot|telegrambot|discordbot|embedly|ia_archiver)        1;
    ~*(applebot|googlebot-image|adsbot-google|rogerbot|showyoubot) 1;
    ~*(outbrain|pinterest|vkShare|W3C_Validator|redditbot)         1;
}

# ── HTTP → HTTPS + ACME challenge ───────────────────────────────────────────
server {
    listen 80;
    server_name proxilio.fr www.proxilio.fr;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://proxilio.fr$request_uri;
    }
}

# ── Redirect HTTPS www → non-www ─────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name www.proxilio.fr;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/proxilio.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxilio.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://proxilio.fr$request_uri;
}

# ── HTTPS principal (canonical : proxilio.fr) ────────────────────────────────
server {
    listen 443 ssl;
    server_name proxilio.fr;
    http2 on;

    # Resolver DNS Docker (requis pour proxy_pass avec variables)
    resolver 127.0.0.11 valid=30s ipv6=off;

    # SSL
    ssl_certificate     /etc/letsencrypt/live/proxilio.fr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/proxilio.fr/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache   shared:MozSSL:10m;
    ssl_session_tickets off;

    # Sécurité
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Upload size (photos entreprise)
    client_max_body_size 25M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json
               application/javascript application/xml+rss image/svg+xml
               font/woff font/woff2;

    # ── Socket.IO WebSocket ─────────────────────────────────────────────────
    # Variable proxy_pass → résolution DNS au moment de la requête (pas au reload)
    location /socket.io/ {
        set $backend       http://backend:3000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
    }

    # ── API Backend ─────────────────────────────────────────────────────────
    location /api {
        set $backend       http://backend:3000;
        proxy_pass         $backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        proxy_connect_timeout 30s;
    }

    # ── Uploads (servis en statique, cache 7j) ──────────────────────────────
    location /app/uploads/ {
        set $backend       http://backend:3000;
        proxy_pass         $backend;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 7d;
        add_header         Cache-Control "public, max-age=604800";
        access_log         off;
    }

    # ── Sitemap XML (proxy vers le backend, caché 1h) ───────────────────────
    location = /sitemap.xml {
        set $backend       http://backend:3000;
        proxy_pass         $backend;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=3600";
    }

    # ── Frontend React + Prerender pour bots ────────────────────────────────
    # Bots → prerender (headless Chrome rend http://frontend:80{uri})
    # Humains → SPA React normal
    location / {
        set $proxy_target  http://frontend:80;
        set $proxy_path    $request_uri;

        if ($is_bot = 1) {
            set $proxy_target http://prerender:3000;
            set $proxy_path   /http://frontend:80$request_uri;
        }

        proxy_pass         $proxy_target$proxy_path;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_pass_header  X-Prerender-Status-Code;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}
